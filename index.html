<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Tenses Game Arcade</title><style>body{font-family:system-ui,sans-serif;background:#101b35;color:#fff;margin:0;padding:20px}main{max-width:850px;margin:auto}h1{color:#f9dc75}.menu{display:flex;flex-wrap:wrap;gap:10px}button{background:#65e0c4;color:#10213a;border:0;border-radius:12px;padding:13px 17px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}.card{background:#243453;border-radius:18px;padding:22px;margin-top:20px}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#e6efff}.hidden{display:none}.correct{color:#8bffb5}.wrong{color:#ffb1b1}input{font-size:18px;padding:12px;border-radius:8px;border:0;width:90%}small{color:#c7d4ed}</style></head><body><main><h1>🎮 English Tenses Game Arcade</h1><p>Practice all 12 tenses with 6 different activities. Choose a game to begin!</p><div class="menu" id="menu"></div><div class="card hidden" id="game"><div id="progress"></div><h2 id="question"></h2><div id="options"></div><p id="feedback"></p><button id="next" class="hidden">Next ➜</button><button onclick="home()">🏠 Games Menu</button></div></main><script>
const data=[
['She ___ to school every day.','goes','go','going','gone','Present Simple'],['Water ___ at 100°C.','boils','boil','boiling','boiled','Present Simple'],['They ___ football on Sundays.','play','plays','played','playing','Present Simple'],['He ___ not like tea.','does','do','is','has','Present Simple'],
['Look! The baby ___.','is sleeping','sleeps','slept','has slept','Present Continuous'],['They ___ dinner right now.','are cooking','cook','cooked','have cooked','Present Continuous'],['I ___ for my keys at the moment.','am looking','look','looked','have looked','Present Continuous'],['Why ___ you laughing?','are','do','did','have','Present Continuous'],
['She ___ her homework already.','has finished','finished','finishes','is finishing','Present Perfect'],['I ___ never visited Japan.','have','has','had','am','Present Perfect'],['They ___ just arrived.','have','has','are','were','Present Perfect'],['He ___ his phone, so he cannot call.','has lost','lost','loses','was losing','Present Perfect'],
['She ___ for two hours and is still studying.','has been studying','studied','studies','had studied','Present Perfect Continuous'],['It ___ raining since morning.','has been','have been','had','is','Present Perfect Continuous'],['They ___ here since 2020.','have been living','had lived','live','were living','Present Perfect Continuous'],['How long ___ you been waiting?','have','has','had','are','Present Perfect Continuous'],
['We ___ a film yesterday.','watched','watch','have watched','were watch','Past Simple'],['He ___ to London last week.','went','goes','gone','has gone','Past Simple'],['They ___ not attend the meeting yesterday.','did','do','have','were','Past Simple'],['I ___ her in 2022.','met','meet','have met','was meeting','Past Simple'],
['At 8 p.m. yesterday, I ___ dinner.','was eating','ate','eat','have eaten','Past Continuous'],['While I was reading, she ___ music.','was listening to','listens to','has listened to','listen to','Past Continuous'],['They ___ when the lights went out.','were dancing','dance','have danced','had danced','Past Continuous'],['What ___ you doing at noon yesterday?','were','are','did','have','Past Continuous'],
['By the time I arrived, the train ___.','had left','left','has left','was leaving','Past Perfect'],['She ___ dinner before the guests arrived.','had prepared','has prepared','prepares','is preparing','Past Perfect'],['They ___ never seen snow before that trip.','had','have','has','were','Past Perfect'],['He realized he ___ his wallet at home.','had forgotten','has forgotten','forgets','was forgetting','Past Perfect'],
['He was tired because he ___ all day.','had been working','has worked','works','was work','Past Perfect Continuous'],['They ___ for hours before help arrived.','had been waiting','have waited','wait','are waiting','Past Perfect Continuous'],['It ___ raining for days before the flood.','had been','has been','was','is','Past Perfect Continuous'],['How long ___ she been studying before the test began?','had','has','have','was','Past Perfect Continuous'],
['I think it ___ tomorrow.','will rain','rained','rains yesterday','has rained','Future Simple'],['She ___ call you later.','will','was','has','did','Future Simple'],['We ___ finish the project next week.','will','had','were','did','Future Simple'],['I promise I ___ help you.','will','had','was','have','Future Simple'],
['This time tomorrow, I ___ on a plane.','will be flying','will fly','flew','have flown','Future Continuous'],['At 9 p.m. tonight, they ___ the match.','will be watching','watched','have watched','watch','Future Continuous'],['She ___ at noon tomorrow.','will be working','worked','has worked','works yesterday','Future Continuous'],['What ___ you be doing at 7 tomorrow?','will','did','have','were','Future Continuous'],
['By Friday, I ___ the report.','will have finished','finished','am finishing','had finished','Future Perfect'],['By 2030, she ___ her degree.','will have completed','completed','has completed','completes','Future Perfect'],['They ___ left by the time we arrive.','will have','had','have','were','Future Perfect'],['By tomorrow morning, he ___ the book.','will have read','was reading','reads','had read','Future Perfect'],
['By June, I ___ here for ten years.','will have been working','have worked','worked','am working','Future Perfect Continuous'],['By 8 p.m., she ___ for six hours.','will have been driving','had driven','drives','was driving','Future Perfect Continuous'],['Next month, they ___ together for a year.','will have been living','have lived','lived','are living','Future Perfect Continuous'],['By midnight, how long ___ you have been studying?','will','have','had','are','Future Perfect Continuous']];
const modes=[['🧠 Multiple Choice','mc'],['✍️ Fill in the Blank','fill'],['⏱️ Speed Challenge','speed'],['🔎 Identify the Tense','identify'],['🏆 Mixed Tense Exam','mixed'],['🔁 Tense Transformation','transform']];let mode='',qs=[],idx=0,score=0,locked=false,timer=null;const $=x=>document.getElementById(x);modes.forEach(([label,id])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>start(id);$('menu').appendChild(b)});function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m){mode=m;qs=shuffle(data).slice(0,m==='mixed'?48:20);idx=0;score=0;$('game').classList.remove('hidden');$('menu').classList.add('hidden');show()}function home(){clearTimeout(timer);$('game').classList.add('hidden');$('menu').classList.remove('hidden')}function show(){clearTimeout(timer);locked=false;$('next').classList.add('hidden');$('feedback').textContent='';if(idx>=qs.length){$('progress').textContent='Completed!';$('question').textContent=`🏅 Your score: ${score}/${qs.length}`;$('options').innerHTML='';$('next').classList.add('hidden');return}let q=qs[idx];$('progress').textContent=`Question ${idx+1}/${qs.length} · Score ${score}`;$('question').textContent=(mode==='identify'?'Identify the tense: '+q[0].replace('___',q[1]):mode==='transform'?'Complete the sentence in '+q[4]+': '+q[0]:q[0]);$('options').innerHTML='';if(mode==='fill'||mode==='transform'){let input=document.createElement('input');input.placeholder='Type the missing words';input.id='answer';$('options').append(input);let b=document.createElement('button');b.textContent='Check answer';b.onclick=()=>check(input.value,q[1]);$('options').append(b);input.onkeydown=e=>{if(e.key==='Enter')check(input.value,q[1])}}else{let correct=mode==='identify'?q[4]:q[1];let choices=mode==='identify'?shuffle([q[4],...shuffle([...new Set(data.map(x=>x[4]).filter(x=>x!==q[4]))]).slice(0,3)]):shuffle(q.slice(1,5));choices.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>check(c,correct);$('options').appendChild(b)})}if(mode==='speed'){let seconds=15;const tick=()=>{if(locked)return;$('progress').textContent=`Question ${idx+1}/${qs.length} · Score ${score} · ⏱️ ${seconds}s`;if(seconds--<=0)check('',q[1]);else timer=setTimeout(tick,1000)};tick()}}function check(value,answer){if(locked)return;locked=true;clearTimeout(timer);let ok=value.trim().toLowerCase().replace(/[.!?]/g,'')===answer.toLowerCase();if(ok)score++;$('feedback').className=ok?'correct':'wrong';$('feedback').textContent=ok?'✅ Correct!':'❌ Correct answer: '+answer;$('next').classList.remove('hidden')}$('next').onclick=()=>{idx++;show()};</script></body></html>
